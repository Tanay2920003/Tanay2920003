<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tanay Anand Mishra</title>
  <desc id="desc">Software that talks to hardware. Android, Flutter, Kotlin, IoT, Next.js. Now building WristGuard, watch to phone security.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono','Liberation Mono',monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
    .fade{opacity:0;animation:fade 1s ease forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.9s}.d5{animation-delay:2.9s}.d6{animation-delay:.6s}
    @keyframes rise{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    .typer{animation:type 1.7s steps(42) 1.2s forwards}
    @keyframes type{to{transform:translateX(506px)}}
    .caret{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .spin{transform-origin:950px 210px;animation:spin 48s linear infinite}
    .spin-r{transform-origin:950px 210px;animation:spin 70s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s cubic-bezier(.2,.6,.3,1) infinite}
    .pulse.late{animation-delay:1.4s}
    @keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(8);opacity:0}}
    .live{transform-box:fill-box;transform-origin:center;animation:live 2s ease-out infinite}
    @keyframes live{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
    .flow{animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.fade{opacity:1}.typer{transform:translateX(506px)}}
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1A212B"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotfade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="420" fill="url(#dotfade)"/></mask>
    <clipPath id="card"><rect width="1200" height="420" rx="20"/></clipPath>
    <clipPath id="headline"><rect x="40" y="100" width="720" height="150"/></clipPath>
    <clipPath id="pill"><rect x="64" y="266" width="620" height="52" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#0A0C10"/>
    <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotmask)"/>
    <circle cx="950" cy="210" r="240" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#1F2630"/>

  <!-- label -->
  <g class="fade d1">
    <text x="64" y="76" class="mono" font-size="15" letter-spacing="3" fill="#7D8590">TANAY ANAND MISHRA</text>
    <rect x="292" y="66" width="6" height="6" rx="1" fill="#5EEAD4"/>
    <text x="310" y="76" class="mono" font-size="15" letter-spacing="3" fill="#7D8590">INDIA</text>
  </g>

  <!-- headline -->
  <g clip-path="url(#headline)">
    <text x="62" y="168" class="sans rise d2" font-size="62" font-weight="700" letter-spacing="-2" fill="#E6EDF3">Software that</text>
    <text x="62" y="236" class="sans rise d3" font-size="62" font-weight="700" letter-spacing="-2" fill="#5EEAD4">talks to hardware.</text>
  </g>

  <!-- terminal line -->
  <g class="fade d6">
    <rect x="64.5" y="266.5" width="619" height="51" rx="11.5" fill="#0F141A" stroke="#1F2630"/>
    <text x="86" y="299" class="mono" font-size="20" fill="#5EEAD4">$</text>
    <text x="110" y="299" class="mono" font-size="20" fill="#C9D1D9" textLength="506" lengthAdjust="spacing">android · flutter · kotlin · iot · next.js</text>
  </g>
  <g clip-path="url(#pill)">
    <g class="typer">
      <rect x="110" y="268" width="572" height="48" fill="#0F141A"/>
      <rect x="111" y="281" width="11" height="24" rx="1" fill="#5EEAD4" class="caret"/>
    </g>
  </g>

  <!-- status -->
  <g class="fade d5">
    <circle cx="70" cy="366" r="4" fill="#F5B14C" class="live"/>
    <circle cx="70" cy="366" r="4" fill="#F5B14C"/>
    <text x="86" y="372" class="mono" font-size="17" fill="#7D8590">now building <tspan fill="#E6EDF3">WristGuard</tspan> — watch ↔ phone security</text>
  </g>

  <!-- system diagram -->
  <g class="fade d4">
    <circle cx="950" cy="210" r="62" fill="none" stroke="#1C232D"/>
    <circle cx="950" cy="210" r="160" fill="none" stroke="#161C24"/>
    <circle cx="950" cy="210" r="110" fill="none" stroke="#2A3440" stroke-dasharray="2 8" class="spin"/>
    <g class="spin-r">
      <circle cx="950" cy="50" r="3" fill="#2A3440"/>
      <circle cx="1088" cy="290" r="3" fill="#2A3440"/>
      <circle cx="812" cy="290" r="3" fill="#2A3440"/>
    </g>

    <path d="M950 100 L1045 265 L855 265 Z" fill="none" stroke="#26303C" stroke-width="1.5"/>
    <path d="M950 100 L1045 265 L855 265 Z" fill="none" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 20" class="flow"/>

    <circle cx="950" cy="210" r="7" fill="#5EEAD4" class="pulse"/>
    <circle cx="950" cy="210" r="7" fill="#5EEAD4" class="pulse late"/>
    <circle cx="950" cy="210" r="6" fill="#5EEAD4"/>

    <circle r="4" fill="#5EEAD4"><animateMotion dur="4.8s" repeatCount="indefinite" path="M950 100 L1045 265 L855 265 Z"/></circle>
    <circle r="4" fill="#5EEAD4"><animateMotion dur="4.8s" begin="-1.6s" repeatCount="indefinite" path="M950 100 L1045 265 L855 265 Z"/></circle>
    <circle r="4" fill="#5EEAD4"><animateMotion dur="4.8s" begin="-3.2s" repeatCount="indefinite" path="M950 100 L1045 265 L855 265 Z"/></circle>
    <circle r="3.5" fill="#F5B14C"><animateMotion dur="7s" repeatCount="indefinite" path="M950 100 L855 265 L1045 265 Z"/></circle>

    <!-- mobile node -->
    <circle cx="950" cy="100" r="28" fill="#0F141A" stroke="#2F3B48" stroke-width="1.5"/>
    <rect x="941" y="86" width="18" height="28" rx="4" fill="none" stroke="#E6EDF3" stroke-width="2"/>
    <rect x="947" y="108" width="6" height="2" rx="1" fill="#E6EDF3"/>
    <text x="950" y="56" class="mono" font-size="13" letter-spacing="2" fill="#7D8590" text-anchor="middle">MOBILE</text>

    <!-- hardware node -->
    <circle cx="1045" cy="265" r="28" fill="#0F141A" stroke="#2F3B48" stroke-width="1.5"/>
    <rect x="1035" y="255" width="20" height="20" rx="3" fill="none" stroke="#E6EDF3" stroke-width="2"/>
    <path d="M1041 251v4M1049 251v4M1041 275v4M1049 275v4M1031 261h4M1031 269h4M1055 261h4M1055 269h4" stroke="#E6EDF3" stroke-width="2" stroke-linecap="round"/>
    <text x="1045" y="316" class="mono" font-size="13" letter-spacing="2" fill="#7D8590" text-anchor="middle">HARDWARE</text>

    <!-- ai node -->
    <circle cx="855" cy="265" r="28" fill="#0F141A" stroke="#2F3B48" stroke-width="1.5"/>
    <path d="M855 252 C857 262 858 263 868 265 C858 267 857 268 855 278 C853 268 852 267 842 265 C852 263 853 262 855 252 Z" fill="#E6EDF3"/>
    <text x="855" y="316" class="mono" font-size="13" letter-spacing="2" fill="#7D8590" text-anchor="middle">AI</text>
  </g>
</svg>
